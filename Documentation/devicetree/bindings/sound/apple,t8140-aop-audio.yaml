%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/apple,t8140-aop-audio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8140 and T8142 AOP audio

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  The Always-On Processor on Apple T8140 SoCs owns the machine's low-power
  audio paths. This node is a child of the AOP node and describes the DMA
  channels and power domains the host needs in order to drive them, namely
  the internal speaker, the 3.5 mm headset jack in both directions, a serial
  monitor tap on the speaker output, and the high-quality microphone array.

  The low-power microphone uses a shared ring on this node's DART stream.
  The remaining audio data moves over the named ADMAC channels while its AOP
  service is active. T8142 uses base-ns ADMAC for both speakers and the jack;
  its low-power microphone ring is optional and its serializer is firmware-owned. The parent AOP binding describes the firmware transport.

allOf:
  - $ref: dai-common.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8142-aop-audio
    then:
      properties:
        dmas:
          maxItems: 4
        dma-names:
          items:
            - const: cout
            - const: cin
            - const: spkr
            - const: sense
        power-domains:
          maxItems: 1
        power-domain-names:
          items:
            - const: mca1
    else:
      properties:
        dmas:
          minItems: 5
        dma-names:
          items:
            - const: spkr
            - const: cout
            - const: cin
            - const: spkr-tap
            - const: hpai
        power-domains:
          minItems: 5
        power-domain-names:
          items:
            - const: tx0
            - const: mca
            - const: mca1
            - const: mca0
            - const: rx0

properties:
  compatible:
    oneOf:
      - const: apple,t8140-aop-audio
      - items:
          - const: apple,t8142-aop-audio
          - const: apple,t8140-aop-audio

  dmas:
    minItems: 4
    maxItems: 5

  dma-names:
    minItems: 4
    maxItems: 5
    items:
      enum: [spkr, cout, cin, spkr-tap, hpai, sense]

  power-domains:
    minItems: 1
    maxItems: 5

  power-domain-names:
    minItems: 1
    maxItems: 5
    items:
      enum: [tx0, mca, mca1, mca0, rx0]

  iommus:
    maxItems: 1

  apple,dma-range:
    $ref: /schemas/types.yaml#/definitions/uint64-array
    minItems: 2
    maxItems: 2
    description: |
      IOVA window the AOP may use for this device's audio buffers, expressed
      as a base followed by its size.

  "#sound-dai-cells":
    const: 1
    description:
      AOP audio DAI identifier. The J700 headset link uses 0 and its speaker
      link uses 4. The T8142 base-ns speaker component uses 5.

  apple,chassis-name:
    $ref: /schemas/types.yaml#/definitions/string
    description:
      Chassis identifier used to name the sound card, matching the
      apple,aop-audio convention.

  apple,machine-kind:
    $ref: /schemas/types.yaml#/definitions/string
    description:
      Human-readable machine name used in the sound card's description.

required:
  - compatible
  - dmas
  - dma-names
  - power-domains
  - power-domain-names
  - iommus
  - apple,dma-range
  - "#sound-dai-cells"
  - apple,chassis-name
  - apple,machine-kind

unevaluatedProperties: false

examples:
  - |
    aop {
        audio {
            compatible = "apple,t8140-aop-audio";
            iommus = <&aop_dart 9>;
            apple,dma-range = <0x100 0x40000000 0x0 0xffff0000>;
            dmas = <&admac_leap_ns 0>, <&admac_base_ns 4>,
                   <&admac_base_ns 5>, <&admac_base_ns 3>,
                   <&admac_leap_s 1>;
            dma-names = "spkr", "cout", "cin", "spkr-tap", "hpai";
            power-domains = <&ps_audio_leap_tx0>, <&ps_audio_leap_mca>,
                            <&ps_audio_mca1_m>, <&ps_audio_mca0_m>,
                            <&ps_audio_leap_rx0>;
            power-domain-names = "tx0", "mca", "mca1", "mca0", "rx0";
            #sound-dai-cells = <1>;
            apple,chassis-name = "J700";
            apple,machine-kind = "MacBook Neo";
        };
    };
